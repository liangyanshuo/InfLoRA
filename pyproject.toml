[tool.poetry]
name = "inflora"
version = "0.1.0"
description = "InfLoRA: Interference-Free Low-Rank Adaptation for Continual Learning"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "methods"}, {include = "models"}, {include = "utils"}]

[tool.poetry.dependencies]
python = "^3.8"
torch = ">=1.10.0"
torchvision = ">=0.11.1"
torchaudio = ">=0.10.0"
numpy = "^1.23.5"
pillow = "^9.4.0"
pyyaml = "^6.0"
tqdm = "^4.62.3"
matplotlib = "^3.4.3"
opencv-python = "^4.6.0"
transformers = "^4.4.2"
datasets = "^1.9.0"
accelerate = "^0.18.0"
timm = "^0.6.7"
pandas = "^1.5.3"
scipy = "^1.7.1"
scikit-learn = "^1.0"
tensorboard = "^2.6.0"
wandb = "^0.12.21"
einops = "^0.4.1"
torchmetrics = "^0.9.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.2"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=methods",
    "--cov=models", 
    "--cov=utils",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["methods", "models", "utils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/conftest.py",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError", 
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"